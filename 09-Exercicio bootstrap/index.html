<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVT Marketing Digital</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> 
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>LVT Marketing Digital</h1>
            <nav>
                <a href="#">Conteúdo</a>
                <a href="#">Instrutores</a>
                <a href="#">Depoimentos</a>
                <a href="#">Sobre nós</a>
            </nav>
        </div>
    </header>
    
    <section class="cadastro container">
        <div class="container img-promo">
            <img src="imagens/mkt1.png" alt="arte do curso">
        </div>
    </section>

    <div class="row">
        <div class="form-titulo formulario">
            <h2> Inscreva-se agora:</h2>
        </div>
        <div class="col d-flex justify-content-center ">
            <form class="formulario ">
                <input type="text" name="nome" placeholder="Nome" required>
                <input type="text" name="nome" placeholder="Sobrenome" required>
                <input type="email" name="email" id="email" placeholder="e-mail" required>
                <input type="tel" name="tel" id="tel" placeholder="Tefone/Celular" required>
                <textarea id="msg" class="form-control" placeholder="Nos envie sua dúvida, (maximo 300 caracteres)." maxlength="300"></textarea>
                <button class=" btn btn-success">
                    Enviar
                </button>
            </form>

        </div>
    </div>
</body>
</html>
